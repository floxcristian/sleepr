# Workflow para CI/CD de microservicios en GCP Multi-País - PRODUCCIÓN
name: Build and Deploy to GCP Artifact Registry (Production)

# Se ejecuta en push a main
on:
  push:
    branches: [main] # Deploy automático cuando se hace push a main
  workflow_dispatch: # Permite ejecución manual para deploys específicos
    inputs:
      target_service:
        description: 'Service to deploy (reservation, auth, notification, payment o all)'
        required: true
        default: 'all'
        type: string

jobs:
  # Job principal que maneja build y deploy de todas las imágenes
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    # Estrategia matrix: solo servicios
    strategy:
      matrix:
        service: [reservation, auth, notification, payment]

    # Configuración de environment (necesario para acceder a secrets y protecciones de producción)
    environment:
      name: production-chile

    # Permisos necesarios para autenticación con GCP usando Workload Identity
    permissions:
      contents: read # Permiso para leer código del repositorio
      id-token: write # Permiso para escribir tokens OIDC (requerido para Workload Identity Federation)

    steps:
      # Step 1: Filtrar servicios si es ejecución manual
      - name: Check if service should be deployed
        if: github.event_name == 'workflow_dispatch' && !contains(inputs.target_service, matrix.service) && inputs.target_service != 'all'
        run: |
          echo "Skipping deployment for ${{ matrix.service }}"
          exit 0

      # Step 2: Descargar código del repositorio
      - name: Checkout code
        uses: actions/checkout@v4 # Action oficial de GitHub para clonar el repo

      # Step 3: Configurar Docker Buildx (builder avanzado de Docker)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Habilita features como cache y multi-arch

      # Step 4: Autenticación con Google Cloud usando Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth # ID para referenciar outputs de este step
        uses: google-github-actions/auth@v2 # Action oficial de Google
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }} # Provider específico configurado en environment secret
          project_id: ${{ vars.PROJECT_ID }} # Project ID específico por país

      # Step 5: Configurar Google Cloud SDK (comando gcloud)
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2 # Instala y configura gcloud CLI

      # Step 6: Configurar Docker para usar gcloud como helper de autenticación
      # Permite a Docker usar credenciales de gcloud para el registry específico del país
      - name: Configure Docker to use gcloud as credential helper
        run: |
          gcloud auth configure-docker ${{ vars.REGISTRY }}

      # Step 7: Construir imagen Docker para cada microservicio
      # Comando docker build explicado:
      # -t: tag/nombre de la imagen final
      # ${{ vars.REGISTRY }}: registry específico (ej: southamerica-west1-docker.pkg.dev)
      # ${{ vars.PROJECT_ID }}: project ID específico (ej: sleepr-chile-463202)
      # ${{ matrix.service }}: nombre del servicio (ej: auth, reservation)
      # ${{ github.sha }}: commit hash para versionado
      # -f: path al Dockerfile específico del servicio
      # .: contexto de build (directorio raíz del proyecto)
      - name: Build Docker image
        run: |
          docker build \
            --target production \
            -t ${{ vars.REGISTRY }}/${{ vars.PROJECT_ID }}/${{ matrix.service }}/production:${{ github.sha }} \
            -t ${{ vars.REGISTRY }}/${{ vars.PROJECT_ID }}/${{ matrix.service }}/production:latest \
            -f apps/${{ matrix.service }}/Dockerfile \
            .

      # Step 8: Subir imagen a Artifact Registry (solo en push a main o workflow_dispatch)
      # Solo se ejecuta cuando es push directo a main o ejecución manual, no en Pull Requests
      - name: Push Docker image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          docker push ${{ vars.REGISTRY }}/${{ vars.PROJECT_ID }}/${{ matrix.service }}/production:${{ github.sha }}
          docker push ${{ vars.REGISTRY }}/${{ vars.PROJECT_ID }}/${{ matrix.service }}/production:latest

      # Step 9: Verificar que el deploy fue exitoso (solo en push a main o workflow_dispatch)
      # Lista la imagen más reciente para confirmar que se subió correctamente
      - name: Verify deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          echo "Successfully deployed ${{ matrix.service }} to Artifact Registry"
          gcloud artifacts docker images list ${{ vars.REGISTRY }}/${{ vars.PROJECT_ID }}/${{ matrix.service }} --limit=1

  # Job separado para notificaciones consolidadas - Mejores prácticas
  notify-teams:
    name: Notify Teams
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    environment:
      name: production-chile

    steps:
      # Evaluar resultados de todos los servicios
      - name: Evaluate deployment results
        id: eval
        run: |
          # Evaluar el resultado general del deployment
          if [[ "${{ needs.build-and-deploy.result }}" == "success" ]]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "Services deployed successfully: reservation, auth, notification, payment"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "One or more services failed to deploy"
          fi

      # Notificación consolidada de éxito
      - name: Notify Teams on Success
        if: steps.eval.outputs.status == 'success'
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: '✅ Deploy Completo - Producción Chile'
          summary: 'Todos los microservicios desplegados exitosamente'
          text: |
            **🚀 Deploy Exitoso en Producción**

            **Servicios desplegados:** reservation, auth, notification, payment
            **Ambiente:** production-chile
            **Commit:** ${{ github.sha }}
            **Registry:** ${{ vars.REGISTRY }}/${{ vars.PROJECT_ID }}
            **Actor:** ${{ github.actor }}
            **Repositorio:** ${{ github.repository }}
          theme_color: '28a745'
          sections: |
            [
              {
                "activityTitle": "📋 Resumen del Deploy",
                "activitySubtitle": "Información consolidada del despliegue",
                "facts": [
                  {
                    "name": "🏷️ Tag de imágenes",
                    "value": "production:${{ github.sha }} + production:latest"
                  },
                  {
                    "name": "🌍 Registry",
                    "value": "${{ vars.REGISTRY }}"
                  },
                  {
                    "name": "📦 Project ID",
                    "value": "${{ vars.PROJECT_ID }}"
                  },
                  {
                    "name": "🌿 Rama",
                    "value": "${{ github.ref_name }}"
                  },
                  {
                    "name": "⏰ Timestamp",
                    "value": "${{ github.event.head_commit.timestamp }}"
                  }
                ]
              }
            ]
          actions: |
            [
              {
                "@type": "OpenUri",
                "name": "🔍 Ver Workflow",
                "targets": [
                  {
                    "os": "default",
                    "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              },
              {
                "@type": "OpenUri",
                "name": "📦 Artifact Registry",
                "targets": [
                  {
                    "os": "default",
                    "uri": "https://console.cloud.google.com/artifacts/docker/${{ vars.PROJECT_ID }}"
                  }
                ]
              }
            ]

      # Notificación consolidada de fallo
      - name: Notify Teams on Failure
        if: steps.eval.outputs.status == 'failure'
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: '❌ Deploy Fallido - Producción Chile'
          summary: 'Error en el despliegue de microservicios'
          text: |
            **🚨 Error en Deploy de Producción**

            **Servicios afectados:** Uno o más de: reservation, auth, notification, payment
            **Ambiente:** production-chile
            **Commit:** ${{ github.sha }}
            **Actor:** ${{ github.actor }}
            **Repositorio:** ${{ github.repository }}

            ⚠️ **Acción requerida:** Revisar logs y reintentar deploy
          theme_color: 'dc3545'
          sections: |
            [
              {
                "activityTitle": "🔍 Información del Error",
                "activitySubtitle": "Detalles para debugging",
                "facts": [
                  {
                    "name": "📦 Project ID",
                    "value": "${{ vars.PROJECT_ID }}"
                  },
                  {
                    "name": "🌿 Rama",
                    "value": "${{ github.ref_name }}"
                  },
                  {
                    "name": "🔧 Job fallido",
                    "value": "build-and-deploy"
                  },
                  {
                    "name": "⏰ Timestamp",
                    "value": "${{ github.event.head_commit.timestamp }}"
                  }
                ]
              }
            ]
          actions: |
            [
              {
                "@type": "OpenUri",
                "name": "🔍 Ver Logs",
                "targets": [
                  {
                    "os": "default",
                    "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              },
              {
                "@type": "OpenUri",
                "name": "🔄 Reintentar Deploy",
                "targets": [
                  {
                    "os": "default",
                    "uri": "${{ github.server_url }}/${{ github.repository }}/actions/workflows/deploy-production.yaml"
                  }
                ]
              }
            ]
